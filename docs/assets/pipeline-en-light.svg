<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="356" viewBox="0 0 1160 356" role="img" aria-labelledby="titolo descrizione"><title id="titolo">The local ITA-OCR pipeline</title><desc id="descrizione">The document is prepared, recognised by GLM-OCR through llama.cpp, spell-checked and compared with the original, all on the user's machine. PDFs that already carry a text layer skip recognition.</desc><rect width="1160" height="356" rx="18" fill="#f1f3ec"/><g font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect x="32" y="58" width="1096" height="232" rx="16" fill="none" stroke="#a9bbaa" stroke-width="1.5" stroke-dasharray="7 6"/><text x="52" y="44" font-size="12" fill="#667069" font-weight="600" text-anchor="start" letter-spacing="1.8">YOUR MACHINE · NO PAGE EVER LEAVES</text><rect x="56" y="96" width="244" height="132" rx="12" fill="#ffffff" stroke="#ccd6c6" stroke-width="1.5"/><rect x="56" y="96" width="4" height="132" rx="2" fill="#22624a"/><text x="80" y="138" font-size="20" fill="#22382c" font-weight="600" text-anchor="start">Document</text><text x="80" y="168" font-size="14.5" fill="#667069" font-weight="400" text-anchor="start">PDF or image</text><text x="80" y="192" font-size="12.5" fill="#667069" font-weight="400" text-anchor="start">opened by the user</text><path d="M306 162.0H313" stroke="#22624a" stroke-width="2" fill="none"/><path d="M311 157.0l6 5-6 5" stroke="#22624a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="324" y="96" width="244" height="132" rx="12" fill="#ffffff" stroke="#ccd6c6" stroke-width="1.5"/><rect x="324" y="96" width="4" height="132" rx="2" fill="#22624a"/><text x="348" y="138" font-size="20" fill="#22382c" font-weight="600" text-anchor="start">Preparation</text><text x="348" y="168" font-size="14.5" fill="#667069" font-weight="400" text-anchor="start">960 × 1248 page</text><text x="348" y="192" font-size="12.5" fill="#667069" font-weight="400" text-anchor="start">150 DPI, as in training</text><path d="M574 162.0H581" stroke="#22624a" stroke-width="2" fill="none"/><path d="M579 157.0l6 5-6 5" stroke="#22624a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="592" y="96" width="244" height="132" rx="12" fill="#ffffff" stroke="#ccd6c6" stroke-width="1.5"/><rect x="592" y="96" width="4" height="132" rx="2" fill="#22624a"/><text x="616" y="138" font-size="20" fill="#22382c" font-weight="600" text-anchor="start">Recognition</text><text x="616" y="168" font-size="14.5" fill="#667069" font-weight="400" text-anchor="start">GLM-OCR on llama.cpp</text><text x="616" y="192" font-size="12.5" fill="#667069" font-weight="400" text-anchor="start">CPU, Vulkan or CUDA</text><path d="M842 162.0H849" stroke="#22624a" stroke-width="2" fill="none"/><path d="M847 157.0l6 5-6 5" stroke="#22624a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="860" y="96" width="244" height="132" rx="12" fill="#ffffff" stroke="#ccd6c6" stroke-width="1.5"/><rect x="860" y="96" width="4" height="132" rx="2" fill="#22624a"/><text x="884" y="138" font-size="20" fill="#22382c" font-weight="600" text-anchor="start">Review</text><text x="884" y="168" font-size="14.5" fill="#667069" font-weight="400" text-anchor="start">compare and export</text><text x="884" y="192" font-size="12.5" fill="#667069" font-weight="400" text-anchor="start">corrections stay visible</text><path d="M796 228v22h-164v-22" stroke="#22624a" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/><path d="M627 236l5-8 5 8" stroke="#22624a" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="714.0" y="272" font-size="12.5" fill="#667069" font-weight="400" text-anchor="middle">cascade: retries when a page comes back incomplete</text><text x="56" y="336" font-size="13.5" fill="#667069" font-weight="400" text-anchor="start">PDF with a text layer: extracted directly, the model is not involved</text></g></svg>