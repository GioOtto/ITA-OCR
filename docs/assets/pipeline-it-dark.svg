<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="356" viewBox="0 0 1160 356" role="img" aria-labelledby="titolo descrizione"><title id="titolo">La pipeline locale di ITA-OCR</title><desc id="descrizione">Il documento viene preparato, riconosciuto da GLM-OCR con llama.cpp, corretto sul lessico e confrontato con l'originale, tutto sul computer dell'utente. I PDF che contengono gia' il testo saltano il riconoscimento.</desc><rect width="1160" height="356" rx="18" fill="#0f0f0f"/><g font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect x="32" y="58" width="1096" height="232" rx="16" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="7 6"/><text x="52" y="44" font-size="12" fill="#b4b4b4" font-weight="600" text-anchor="start" letter-spacing="1.8">IL TUO COMPUTER · NESSUNA PAGINA ESCE</text><rect x="56" y="96" width="244" height="132" rx="12" fill="#1a1a1a" stroke="#2f2f2f" stroke-width="1.5"/><rect x="56" y="96" width="4" height="132" rx="2" fill="#ececec"/><text x="80" y="138" font-size="20" fill="#ececec" font-weight="600" text-anchor="start">Documento</text><text x="80" y="168" font-size="14.5" fill="#b4b4b4" font-weight="400" text-anchor="start">PDF o immagine</text><text x="80" y="192" font-size="12.5" fill="#b4b4b4" font-weight="400" text-anchor="start">aperto dall'utente</text><path d="M306 162.0H313" stroke="#ececec" stroke-width="2" fill="none"/><path d="M311 157.0l6 5-6 5" stroke="#ececec" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="324" y="96" width="244" height="132" rx="12" fill="#1a1a1a" stroke="#2f2f2f" stroke-width="1.5"/><rect x="324" y="96" width="4" height="132" rx="2" fill="#ececec"/><text x="348" y="138" font-size="20" fill="#ececec" font-weight="600" text-anchor="start">Preparazione</text><text x="348" y="168" font-size="14.5" fill="#b4b4b4" font-weight="400" text-anchor="start">pagina 960 × 1248</text><text x="348" y="192" font-size="12.5" fill="#b4b4b4" font-weight="400" text-anchor="start">150 DPI, come in addestramento</text><path d="M574 162.0H581" stroke="#ececec" stroke-width="2" fill="none"/><path d="M579 157.0l6 5-6 5" stroke="#ececec" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="592" y="96" width="244" height="132" rx="12" fill="#1a1a1a" stroke="#2f2f2f" stroke-width="1.5"/><rect x="592" y="96" width="4" height="132" rx="2" fill="#ececec"/><text x="616" y="138" font-size="20" fill="#ececec" font-weight="600" text-anchor="start">Riconoscimento</text><text x="616" y="168" font-size="14.5" fill="#b4b4b4" font-weight="400" text-anchor="start">GLM-OCR su llama.cpp</text><text x="616" y="192" font-size="12.5" fill="#b4b4b4" font-weight="400" text-anchor="start">CPU, Vulkan o CUDA</text><path d="M842 162.0H849" stroke="#ececec" stroke-width="2" fill="none"/><path d="M847 157.0l6 5-6 5" stroke="#ececec" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="860" y="96" width="244" height="132" rx="12" fill="#1a1a1a" stroke="#2f2f2f" stroke-width="1.5"/><rect x="860" y="96" width="4" height="132" rx="2" fill="#ececec"/><text x="884" y="138" font-size="20" fill="#ececec" font-weight="600" text-anchor="start">Verifica</text><text x="884" y="168" font-size="14.5" fill="#b4b4b4" font-weight="400" text-anchor="start">confronto ed esportazione</text><text x="884" y="192" font-size="12.5" fill="#b4b4b4" font-weight="400" text-anchor="start">correzioni evidenziate</text><path d="M796 228v22h-164v-22" stroke="#ececec" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/><path d="M627 236l5-8 5 8" stroke="#ececec" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="714.0" y="272" font-size="12.5" fill="#b4b4b4" font-weight="400" text-anchor="middle">cascata: se la pagina finisce incompleta, ritenta</text><text x="56" y="336" font-size="13.5" fill="#b4b4b4" font-weight="400" text-anchor="start">PDF con livello di testo: estrazione diretta, senza passare dal modello</text></g></svg>