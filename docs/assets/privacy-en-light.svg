<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="400" viewBox="0 0 1160 400" role="img" aria-labelledby="titolo descrizione"><title id="titolo">Where the data stays with ITA-OCR</title><desc id="descrizione">Documents, transcriptions, history, model and dictionaries stay on the machine. The network is only used to download the installer. No telemetry, no remote OCR API, no account.</desc><rect width="1160" height="400" rx="18" fill="#f7f7f8"/><g font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect x="36" y="60" width="660" height="284" rx="16" fill="none" stroke="#c9cacd" stroke-width="1.5" stroke-dasharray="7 6"/><text x="56" y="44" font-size="12" fill="#5c6065" font-weight="600" text-anchor="start" letter-spacing="1.8">YOUR MACHINE</text><text x="826" y="44" font-size="12" fill="#5c6065" font-weight="600" text-anchor="start" letter-spacing="1.8">NETWORK</text><rect x="58" y="84" width="616" height="44" rx="10" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.5"/><circle cx="82" cy="106" r="4.5" fill="#1f2023"/><text x="100" y="111" font-size="15.5" fill="#1f2023" font-weight="600" text-anchor="start">Documents and pages</text><text x="372" y="111" font-size="13.5" fill="#5c6065" font-weight="400" text-anchor="start">opened locally, never uploaded</text><rect x="58" y="136" width="616" height="44" rx="10" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.5"/><circle cx="82" cy="158" r="4.5" fill="#1f2023"/><text x="100" y="163" font-size="15.5" fill="#1f2023" font-weight="600" text-anchor="start">Transcriptions and history</text><text x="372" y="163" font-size="13.5" fill="#5c6065" font-weight="400" text-anchor="start">stored in the user profile</text><rect x="58" y="188" width="616" height="44" rx="10" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.5"/><circle cx="82" cy="210" r="4.5" fill="#1f2023"/><text x="100" y="215" font-size="15.5" fill="#1f2023" font-weight="600" text-anchor="start">GGUF model</text><text x="372" y="215" font-size="13.5" fill="#5c6065" font-weight="400" text-anchor="start">read from disk at start-up</text><rect x="58" y="240" width="616" height="44" rx="10" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.5"/><circle cx="82" cy="262" r="4.5" fill="#1f2023"/><text x="100" y="267" font-size="15.5" fill="#1f2023" font-weight="600" text-anchor="start">Dictionaries</text><text x="372" y="267" font-size="13.5" fill="#5c6065" font-weight="400" text-anchor="start">local spelling correction</text><rect x="58" y="292" width="616" height="44" rx="10" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.5"/><circle cx="82" cy="314" r="4.5" fill="#1f2023"/><text x="100" y="319" font-size="15.5" fill="#1f2023" font-weight="600" text-anchor="start">llama-server</text><text x="372" y="319" font-size="13.5" fill="#5c6065" font-weight="400" text-anchor="start">listening on 127.0.0.1</text><rect x="826" y="120" width="298" height="78" rx="10" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.5"/><text x="850" y="153" font-size="16.5" fill="#1f2023" font-weight="600" text-anchor="start">Complete installer</text><text x="850" y="177" font-size="13" fill="#5c6065" font-weight="400" text-anchor="start">GitHub · models included</text><path d="M818 159H713" stroke="#1f2023" stroke-width="2" fill="none"/><path d="M715 154l-6 5 6 5" stroke="#1f2023" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="826" y="232" width="298" height="78" rx="10" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.5"/><text x="850" y="265" font-size="16.5" fill="#1f2023" font-weight="600" text-anchor="start">Weights alone</text><text x="850" y="289" font-size="13" fill="#5c6065" font-weight="400" text-anchor="start">Hugging Face · optional</text><path d="M818 271H713" stroke="#1f2023" stroke-width="2" fill="none"/><path d="M715 266l-6 5 6 5" stroke="#1f2023" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="761" y="336" font-size="12.5" fill="#5c6065" font-weight="400" text-anchor="middle">inbound only</text><text x="580.0" y="378" font-size="13.5" fill="#5c6065" font-weight="400" text-anchor="middle">No telemetry · No remote OCR API · No account · Works offline</text></g></svg>