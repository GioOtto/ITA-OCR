<g font-family="Arial,sans-serif" fill="#263e30" font-size="20"><text x="58" y="108">Documento</text><text x="330" y="108">Preparazione</text><text x="602" y="108">GLM-OCR</text><text x="874" y="108">Confronto</text></g>
