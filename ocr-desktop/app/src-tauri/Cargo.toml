[package]
name = "ocr-ita-desktop"
version = "1.0.0"
edition = "2021"
description = "OCR di manoscritto italiano con GLM-OCR fine-tunato, in locale"
repository = "https://github.com/GioOtto/ITA-OCR"
default-run = "ocr-ita-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
libloading = "0.8"
regex = "1"
spellbook = "0.4.2"
unicode-normalization = "0.1"
docx-rs = "0.4.22"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true

# Le dipendenze di sistema sono separate: libc non esiste su Windows, e
# windows-sys non serve altrove.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Win32_Security non si usa direttamente, ma CreateJobObjectW e' dichiarato
# dietro quella feature: la sua firma nomina SECURITY_ATTRIBUTES, che vive nel
# modulo Security. Senza, l'import non risolve e il job object non si crea.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
